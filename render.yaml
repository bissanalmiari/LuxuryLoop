# Render blueprint — LuxuryLoop backend (FastAPI)
# Deploy: https://render.com → Blueprint → this repo
services:
  - type: web
    name: luxuryloop-api
    runtime: python
    rootDir: backend
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: ENVIRONMENT
        value: production
      - key: API_V1_PREFIX
        value: /api/v1
      - key: CORS_ORIGINS
        sync: false # set to your Vercel domain, e.g. https://luxuryloop.vercel.app
      - key: SITE_URL
        sync: false # set to the hosted frontend URL, e.g. https://luxuryloop.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: AI_ASSESSMENT_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false